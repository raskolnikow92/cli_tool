[package]
name = "cli_tool"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.2", features = ["derive"] }  # CLI parsing
rayon = "1.7"                                     # Parallelisierung
walkdir = "2.3"                                   # Directory traversal
serde = { version = "1.0", features = ["derive"] } # JSON Serialisierung
anyhow = "1.0"                                     # Error Handling
regex = "1.10"                                    # Pattern matching
